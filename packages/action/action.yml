name: 'ete E2E tests'
description: 'Replay agent-recorded E2E tests with recordings, publish them to your central ete reports site, and comment on the PR'
author: 'kzfsg'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  url:
    description: 'Base URL of the app under test (overrides ete.yaml)'
    required: false
  start:
    description: 'Command that serves the app (overrides ete.yaml). Leave empty for a deployed URL.'
    required: false
  config:
    description: 'Path to ete.yaml'
    required: false
    default: 'ete.yaml'
  tests:
    description: 'Test files or globs (space separated). Default: e2e/**/*.yaml'
    required: false
    default: ''
  comment:
    description: 'Post/update a sticky PR comment with results'
    required: false
    default: 'true'
  working-directory:
    description: 'Directory containing ete.yaml'
    required: false
    default: '.'
  node-version:
    description: 'Node version to use'
    required: false
    default: '22'
  blob-token:
    description: 'Vercel Blob read-write token of the central ete reports store. When set with site-url, results are published and the PR comment links into the site.'
    required: false
    default: ''
  site-url:
    description: 'URL of the central ete reports site, e.g. https://ete-reports.vercel.app'
    required: false
    default: ''
  retention-days:
    description: "Prune this repository's published runs older than this many days"
    required: false
    default: '30'
  workers:
    description: 'Replay this many tests at once (tests must not share app state)'
    required: false
    default: '1'
  shard:
    description: 'Run only this slice of the suite, e.g. 2/4. Use with a matrix; all shards publish to the same run.'
    required: false
    default: ''

outputs:
  outcome:
    description: '"success" or "failure"'
    value: ${{ steps.run.outcome }}
  results-dir:
    description: 'Path to ete-results/'
    value: ${{ inputs.working-directory }}/ete-results

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build ete
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${{ github.action_path }}/../.."
        cd "$ROOT"
        npm i -g pnpm@11 >/dev/null
        pnpm install --frozen-lockfile
        pnpm -r --filter '@ete/core' --filter '@ete/driver-browser' --filter 'ete' build
        echo "ETE_BIN=$ROOT/packages/cli/dist/index.js" >> "$GITHUB_ENV"
        cd packages/driver-browser && npx playwright install --with-deps chromium

    - name: Run tests
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        set -uo pipefail
        ARGS=(run --ci --config "${{ inputs.config }}")
        [ -n "${{ inputs.url }}" ] && ARGS+=(--url "${{ inputs.url }}")
        [ -n "${{ inputs.start }}" ] && ARGS+=(--start "${{ inputs.start }}")
        ARGS+=(--workers "${{ inputs.workers }}")
        [ -n "${{ inputs.shard }}" ] && ARGS+=(--shard "${{ inputs.shard }}")
        # artifact names may not contain "/"
        echo "SHARD_TAG=$(printf '%s' '${{ inputs.shard }}' | tr '/' '-' | sed 's/^./-shard-&/')" >> "$GITHUB_ENV"

        # shellcheck disable=SC2206
        [ -n "${{ inputs.tests }}" ] && ARGS+=(${{ inputs.tests }})
        node "$ETE_BIN" "${ARGS[@]}"

    - name: Upload recordings
      id: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ete-results-${{ github.run_id }}-${{ github.run_attempt }}${{ env.SHARD_TAG }}
        path: ${{ inputs.working-directory }}/ete-results
        if-no-files-found: ignore
        retention-days: 14

    - name: Publish to the reports site
      if: always() && inputs.blob-token != '' && inputs.site-url != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BLOB_READ_WRITE_TOKEN: ${{ inputs.blob-token }}
        ETE_SITE_URL: ${{ inputs.site-url }}
      run: node "$ETE_BIN" publish --retention-days "${{ inputs.retention-days }}"

    - name: Comment on PR
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        # REPORT_URL is exported by `ete publish` via GITHUB_ENV
      run: node "${{ github.action_path }}/scripts/comment.mjs"

    - name: Fail if tests failed
      if: steps.run.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::ete E2E tests failed. See the PR comment or the ete-results artifact."
        exit 1
